[project]
name = "m2tools"
version = "0.2.0"
description = "CLI tools for managing a local Maven repository"
requires-python = ">=3.8"
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
m2tools = "m2tools.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
