[project]
name = "m2tools"
version = "0.1.0"
description = "CLI tools for managing a local Maven repository"
requires-python = ">=3.8"

[project.scripts]
m2delete = "m2tools.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
